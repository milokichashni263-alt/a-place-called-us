<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Place Called Us</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background"></div>

<div class="container">

    <p class="moon">☾</p>

    <h1>A Place Called Us</h1>

    <p class="quote">
        Some places exist on maps.
        <br>
        Some exist in people's hearts.
    </p>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Our little secret..."
        >

        <button id="unlockButton">
            ♡ Unlock ♡
        </button>

    </div>

</div>

<div class="welcome-screen" id="welcomeScreen">

    <h2>
        Welcome home,
        <br>
        Baba.
    </h2>

</div>

<script src="script.js"></script>
</body>
</html>
