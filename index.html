<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Place Called Us</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>

    <!-- Password Page -->
    <div class="container">

        <p class="moon">☾</p>

        <h1>A Place Called Us</h1>

        <p class="quote">
            Some places exist on maps.
            <br>
            Some exist in people's hearts.
        </p>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Our little secret..."
            >

            <button id="unlockButton">
                ♡ Unlock ♡
            </button>

        </div>

    </div>

    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcomeScreen">

        <h2>
            Welcome home,
            <br>
            Baba.
        </h2>

    </div>

    <!-- Home Page -->
    <div class="home-page" id="homePage">

        <section class="hero">

            <h1>A Place Called Us</h1>

            <p class="hero-text">
                Every story has a beginning.
                <br>
                Ours started with a simple hello.
            </p>

            <div class="scroll-down">
                ↓ Scroll to begin
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
